  <script src="assets/vendor/waypoints/noframework.waypoints.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    (function() {
      "use strict";
      document.getElementById('year').textContent = new Date().getFullYear();

      const titleEl = document.getElementById('article-title');
      const crumbEl = document.getElementById('article-crumb');
      const metaEl = document.getElementById('article-meta');
      const bodyEl = document.getElementById('article-body');
      const slug = new URLSearchParams(location.search).get('slug');

      function showError(message) {
        titleEl.textContent = 'Article introuvable';
        bodyEl.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'feed-placeholder';
        p.textContent = message;
        bodyEl.appendChild(p);
      }

      if (!slug) {
        showError('Aucun article sélectionné.');
        return;
      }

      fetch('/api/github?article=' + encodeURIComponent(slug))
        .then(res => res.ok ? res.json() : Promise.reject(res.status))
        .then(article => {
          document.title = article.title + ' - Oscar NKFUTU MAKANGA';
          titleEl.textContent = article.title;
          crumbEl.textContent = article.title;

          const parts = [];
          if (article.date) {
            const d = new Date(article.date);
            parts.push('<i class="bi bi-calendar3"></i> ' + (isNaN(d) ? article.date : d.toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' })));
          }
          if (article.tags && article.tags.length) parts.push('<i class="bi bi-tags"></i> ' + article.tags.join(', '));
          parts.push('<a href="' + article.sourceUrl + '" target="_blank" rel="noopener"><i class="bi bi-github"></i> Voir sur GitHub</a>');
          metaEl.innerHTML = DOMPurify.sanitize(parts.join(' &nbsp;·&nbsp; '), { ADD_ATTR: ['target'] });

          bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(article.markdown));
        })
        .catch(() => showError('Cet article n’existe pas ou n’est pas disponible pour le moment.'));
    })();
  </script>
</body>

</html>
